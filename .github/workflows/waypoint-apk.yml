# Builds the Waypoint Android app and publishes the APK as a GitHub Release.
#   - Every push to main that touches waypoint/ makes a new release; the newest is always at
#     https://github.com/Egotauron/Profile/releases/latest/download/Waypoint.apk
#   - Pull requests only build and test, and attach the APK to the run.
# Releases are signed with the key in the WAYPOINT_KEYSTORE_BASE64 secret, so each new APK
# installs over the one on your phone (see waypoint/README.md, "Updates").
name: Waypoint APK

on:
  push:
    branches: [main]
    paths: ["waypoint/**", ".github/workflows/waypoint-apk.yml"]
  pull_request:
    paths: ["waypoint/**", ".github/workflows/waypoint-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waypoint-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: waypoint
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.WAYPOINT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the WAYPOINT_KEYSTORE_BASE64 repository secret (waypoint/README.md, Updates) so new versions install over the app on your phone."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waypoint.jks"
          echo "WAYPOINT_KEYSTORE=$RUNNER_TEMP/waypoint.jks" >> "$GITHUB_ENV"

      - name: Test and build
        run: >
          ./gradlew --no-daemon :trip:test :providers:test :app:assembleRelease
          -Pwaypoint.versionCode=$((100 + ${{ github.run_number }}))
          -Pwaypoint.versionName=$VERSION_NAME

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-arm64-v8a-release.apk Waypoint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Waypoint-${{ env.VERSION_NAME }}
          path: waypoint/Waypoint.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "waypoint-v$VERSION_NAME" Waypoint.apk \
            --title "Waypoint $VERSION_NAME" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: download Waypoint.apk below and open it to install or update (Android 10 or newer)."
